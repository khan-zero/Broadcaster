name: MASTER_BUILD

on:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller
    - name: Build EXE
      run: |
        # Note: We are NOT injecting secrets into the build anymore to keep it clean.
        # The app will prompt the user for API keys on first run.
        pyinstaller --onefile --noconsole --icon="app_logo_image.png" --add-data "app_logo_image.png;." --add-data "src;src" --collect-all customtkinter main.py
    - name: Upload Finished EXE
      uses: actions/upload-artifact@v4
      with:
        name: Broadcaster-Windows
        path: dist/main.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install -r requirements.txt pyinstaller
    - name: Build Linux Binary
      run: |
        pyinstaller --onefile --windowed --icon="app_logo_image.png" --add-data "app_logo_image.png:." --add-data "src:src" --collect-all customtkinter main.py
    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Broadcaster-Linux
        path: dist/main
